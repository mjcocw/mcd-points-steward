<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦麦积分资产体检报告 · McPoints Steward</title>
<style>
:root{--ink:#1a1a1a;--sub:#6b6b6b;--line:rgba(0,0,0,.10);--bg:#f7f6f3;--red:#DA291C;--gold:#FFC72C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6}
.bar{position:sticky;top:0;z-index:10;background:#12141a;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;border-bottom:3px solid var(--red)}
.bar b{font-weight:500;font-size:15px}
.bar span{font-size:12.5px;color:#9aa1ad}
.bar code{background:#1c1f27;border:1px solid #2a2e37;border-radius:5px;padding:2px 7px;font-size:12px;color:#e8eaed;font-family:Menlo,Consolas,monospace}
.bar a{color:var(--gold);text-decoration:none;font-size:12.5px;border:1px solid #3a3f4a;border-radius:6px;padding:3px 10px}
.bar a:hover{border-color:var(--gold)}
.frame{height:calc(100vh - 53px);width:100%;border:0;display:block;background:var(--bg)}
@media (max-width:720px){.bar code{display:none}.frame{height:calc(100vh - 96px)}}
</style>
</head>
<body>
<div class="bar">
  <b>🍔 麦麦积分资产体检报告</b>
  <span>McPoints Steward · 基于麦当劳官方 MCP Server · 离线演示数据</span>
  <code>python main.py --mock --html demo/report.html</code>
  <a href="https://github.com/M-China/mcd-developer-innovation-challenge" target="_blank" rel="noopener">1024 程序员节参赛作品</a>
</div>
<iframe class="frame" src="./report.html" title="麦麦积分资产体检报告"></iframe>
</body>
</html>
